apply plugin: 'com.android.application'

// Release signing reads android/keystore.properties, which is never committed:
//   storeFile=danki-release.jks   storePassword=...   keyAlias=danki   keyPassword=...
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = "za.co.bta.dankidriver"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "za.co.bta.dankidriver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    // Two builds of the same app: "sideload" is downloaded from the website and checks it for
    // updates; "play" is for the Play Store, which handles updates itself. Same id, same key.
    flavorDimensions = ["store"]
    productFlavors {
        sideload { dimension "store" }
        play { dimension "store" }
    }
    buildTypes {
        release {
            debuggable false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Each build gets its own public/js/build-info.js: its version number, and whether it checks the
// website for updates (sideload only). server/build-app.js leaves the web's copy out of www/.
abstract class BuildInfoTask extends DefaultTask {
    @Input abstract Property<Integer> getVersionCode()
    @Input abstract Property<String> getVersionName()
    @Input abstract Property<Boolean> getUpdateCheck()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void write() {
        def file = outputDir.get().file('public/js/build-info.js').asFile
        file.parentFile.mkdirs()
        def name = versionName.get().replaceAll(/[^0-9A-Za-z._-]/, '')
        file.text = "// Written by the Android build.\n" +
            "export const BUILD = Object.freeze({ versionCode: ${versionCode.get()}, versionName: '${name}', updateCheck: ${updateCheck.get()} });\n"
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def output = variant.outputs.first()
        def task = project.tasks.register("${variant.name}BuildInfo", BuildInfoTask) {
            versionCode.set(output.versionCode)
            versionName.set(output.versionName)
            updateCheck.set(variant.flavorName == 'sideload')
        }
        variant.sources.assets.addGeneratedSourceDirectory(task, { it.outputDir })
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
