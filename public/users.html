<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff | Dankie Driver</title>
  <meta name="theme-color" content="#0144b7">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon-192.png" type="image/png">
  <link rel="preload" href="/fonts/spline-sans-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/slip-base.css">
  <link rel="stylesheet" href="/css/staff.css">
  <script>try{var t=localStorage.getItem('bta:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
  <header id="topbar"></header>
  <main class="users">
    <div>
      <h1>Staff</h1>
      <p class="muted">Everyone who can sign in. Marshals record taxis at their own rank only. Drivers share their taxi's position (after agreeing to the location notice). Admins can do everything, including this page.</p>
    </div>

    <form class="users-add" id="add" novalidate>
      <label class="field">Name <input class="input" id="add-name" maxlength="60" autocomplete="off" required></label>
      <label class="field">Cellphone <input class="input" id="add-phone" type="tel" inputmode="tel" maxlength="20" placeholder="082 123 4567" autocomplete="off" required></label>
      <label class="field">Role
        <select class="input" id="add-role">
          <option value="marshal">Marshal</option>
          <option value="admin">Admin</option>
          <option value="driver">Driver</option>
        </select>
      </label>
      <label class="field" id="add-rank-wrap">Rank <select class="input" id="add-rank"></select></label>
      <label class="field" id="add-taxi-wrap" hidden>Taxi they drive <select class="input" id="add-taxi"></select></label>
      <label class="field" id="add-plate-wrap" hidden>Number plate <input class="input" id="add-plate" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="JB 21 MN GP"></label>
      <label class="field" id="add-seats-wrap" hidden>Seats <input class="input" id="add-seats" type="number" inputmode="numeric" min="4" max="35" value="15"></label>
      <button class="btn primary" type="submit">Add person</button>
    </form>

    <ul class="user-list" id="list" aria-live="polite"></ul>
  </main>
  <script type="module" src="/js/users.js"></script>
</body>
</html>
