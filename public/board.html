<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rank screen | Danki Driver</title>
  <meta name="theme-color" content="#0c1a4b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon-192.png" type="image/png">
  <link rel="preload" href="/fonts/spline-sans-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/slip-base.css">
  <link rel="stylesheet" href="/css/staff.css">
</head>
<body class="board-page">
  <header id="topbar"></header>
  <main class="board">
    <div class="board-head">
      <div>
        <h1 id="b-rank">Rank screen</h1>
        <p class="board-sub">Taxis loading now. Board the first taxi for your destination.</p>
      </div>
      <div class="board-right">
        <div class="clock" id="b-clock" aria-label="Time"></div>
        <img class="board-logo" src="/img/bta-logo.png" width="72" height="72" alt="Benoni Taxi Association">
      </div>
    </div>
    <ul class="board-rows" id="b-rows" aria-live="polite"></ul>
    <p class="arrivals" id="b-arrivals"></p>
    <div class="board-foot">
      <span>Benoni Taxi Association.</span>
      <label>Show rank <select class="input" id="b-switch"></select></label>
      <button class="btn sm board-full" type="button" id="b-full">Full screen for the wall</button>
    </div>
  </main>
  <script type="module" src="/js/board.js"></script>
</body>
</html>
