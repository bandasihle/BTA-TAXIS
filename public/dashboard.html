<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard | Dankie Driver</title>
  <meta name="theme-color" content="#0144b7">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="preload" href="/fonts/spline-sans-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/slip-base.css">
  <link rel="stylesheet" href="/css/staff.css">
  <script>try{var t=localStorage.getItem('bta:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
  <header id="topbar"></header>
  <main class="mapview">
    <h1 class="visually-hidden">Association dashboard</h1>
    <div class="map" id="map" aria-label="Map of ranks and taxis"></div>
    <aside class="panel" aria-label="Ranks, trips and taxis">
      <div class="summary" id="summary" role="group" aria-label="Show taxis by state"></div>
      <div class="late" id="late" role="status" aria-live="polite" hidden></div>
      <div class="filters">
        <label class="visually-hidden" for="f-route">Route</label>
        <select class="input" id="f-route"><option value="all">All routes</option></select>
        <label class="visually-hidden" for="f-q">Find a plate</label>
        <input class="input" id="f-q" type="search" placeholder="Find a plate" autocomplete="off" spellcheck="false">
      </div>
      <div class="ptabs" role="tablist" aria-label="Panel">
        <button class="ptab" role="tab" type="button" data-tab="ranks">Ranks</button>
        <button class="ptab" role="tab" type="button" data-tab="trips">Trip log</button>
        <button class="ptab" role="tab" type="button" data-tab="taxis">Taxis</button>
      </div>
      <div class="panel-scroll" id="panel-body"></div>
      <div class="footer" style="border-top:1px solid var(--line)">Taxis on the road show where their driver's phone says they are. A dashed dot is an estimate along the route, for when the phone is not sending its location.</div>
    </aside>
  </main>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
