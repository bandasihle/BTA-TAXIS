<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Danki Driver</title>
  <meta name="description" content="Find your taxi rank on the map and see where the taxis go, when they run and what they cost. Benoni Taxi Association.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/danki.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body class="dk">
  <header class="dk-head">
    <div class="dk-head-in">
      <a class="dk-word" href="#/" aria-label="Danki Driver, back to provinces">
        <span class="dk-word-a">Danki</span><span class="dk-word-b">Driver</span>
      </a>
      <img class="dk-bta" src="/img/bta-logo.png" width="56" height="56" alt="Benoni Taxi Association, SANTACO">
    </div>
  </header>
  <div class="dk-app">
    <div class="dk-map" id="map" role="region" aria-label="Map. Tap a pin to choose it, or use the list."></div>
    <section class="dk-panel">
      <nav class="dk-trail" id="trail" aria-label="You are here"></nav>
      <main class="dk-main" id="view" tabindex="-1"></main>
      <footer class="dk-foot">
        <p>Benoni Taxi Association. The wheels of the nation.</p>
        <p><a href="/staff">Association staff: rank tracker</a></p>
      </footer>
    </section>
  </div>
  <script type="module" src="/js/danki.js"></script>
</body>
</html>
